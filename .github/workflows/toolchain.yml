name: Build i686 Cross-Compilers

on:
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # Prevents one failure from cancelling the others
      matrix:
        os: [ubuntu-22.04, macos-26]

    steps:
      - name: Install Build Dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential m4 bison flex libgmp3-dev libmpc-dev libmpfr-dev texinfo

      - name: Install Build Dependencies (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1 # Bypasses the GitHub runner AWS tap issue
        run: brew install gcc binutils gmp mpfr libmpc texinfo m4

      - name: Download GCC and Binutils Source
        run: |
          wget https://ftp.gnu.org/gnu/binutils/binutils-2.42.tar.gz
          wget https://ftp.gnu.org/gnu/gcc/gcc-13.3.0/gcc-13.3.0.tar.gz
          tar -xf binutils-2.42.tar.gz
          tar -xf gcc-13.3.0.tar.gz

          # Tell GCC to fetch and bundle its own math libraries locally
          cd gcc-13.3.0
          ./contrib/download_prerequisites

      - name: Build Binutils
        run: |
          # Use Homebrew & some macOS native tools for compilation
          export PATH="/opt/homebrew/opt/texinfo/bin:/opt/homebrew/opt/flex/bin:/opt/homebrew/opt/bison/bin:$PATH"
          export CFLAGS="-Wno-error=implicit-function-declaration"
          export CXXFLAGS="-Wno-error=implicit-function-declaration"
          export CPPFLAGS="-I/opt/homebrew/include"
          export LDFLAGS="-L/opt/homebrew/lib"

          mkdir build-binutils && cd build-binutils
          ../binutils-2.42/configure --target=i686-elf --prefix=$GITHUB_WORKSPACE/xinu-toolchain --with-sysroot --disable-nls --disable-werror
          make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)
          make install-strip

      - name: Build GCC
        run: |
          export PATH="$GITHUB_WORKSPACE/xinu-toolchain/bin:$PATH"
          mkdir build-gcc && cd build-gcc
          ../gcc-13.3.0/configure --target=i686-elf --prefix=$GITHUB_WORKSPACE/xinu-toolchain --disable-nls --enable-languages=c --without-headers
          make all-gcc -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)
          make install-strip-gcc

      - name: Build Flex and Bison
        run: |
          wget https://github.com/westes/flex/releases/download/v2.6.4/flex-2.6.4.tar.gz
          wget https://ftp.gnu.org/gnu/bison/bison-3.8.2.tar.gz
          tar -xf flex-2.6.4.tar.gz
          tar -xf bison-3.8.2.tar.gz

          # Build Flex and its libfl.a library
          cd flex-2.6.4
          ./configure --prefix=$GITHUB_WORKSPACE/xinu-toolchain --disable-shared
          make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)
          make install
          cd ..

          # Build Bison
          cd bison-3.8.2
          ./configure --prefix=$GITHUB_WORKSPACE/xinu-toolchain --disable-shared
          make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)
          make install
          cd ..

      - name: Package Toolchain
        run: |
          tar -czvf i686-elf-toolchain-${{ matrix.os }}.tar.gz -C xinu-toolchain .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: i686-elf-toolchain-${{ matrix.os }}
          path: i686-elf-toolchain-${{ matrix.os }}.tar.gz
